<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Store - Top Up & Accounts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
        }
        header {
            background: #1e293b;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ff7300;
        }
        header h1 {
            color: #ff7300;
            font-size: 24px;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        h2 {
            margin-bottom: 15px;
            border-left: 4px solid #ff7300;
            padding-left: 10px;
            font-size: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            padding: 15px;
            border: 1px solid #334155;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
        .card h3 {
            margin: 10px 0;
            font-size: 18px;
        }
        .card p {
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn {
            background: #ff7300;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: #e06500;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
        }
        .close-btn {
            background: #ef4444;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔥 GAMER ZONE FF STORE 🔥</h1>
        <p>Best Place for Top-Ups & Accounts</p>
    </header>

    <div class="container">
        <!-- Top Up Section -->
        <h2>Free Fire Top-Up Packages</h2>
        <div class="grid">
            <div class="card">
                <h3>100 Diamonds</h3>
                <p>Rs. 300.00</p>
                <button class="btn" onclick="openCheckout('100 Diamonds', 'Rs. 300')">Buy Now</button>
            </div>
            <div class="card">
                <h3>310 Diamonds</h3>
                <p>Rs. 850.00</p>
                <button class="btn" onclick="openCheckout('310 Diamonds', 'Rs. 850')">Buy Now</button>
            </div>
            <div class="card">
                <h3>Weekly Membership</h3>
                <p>Rs. 550.00</p>
                <button class="btn" onclick="openCheckout('Weekly Membership', 'Rs. 550')">Buy Now</button>
            </div>
        </div>

        <!-- Account Store Section -->
        <h2>Free Fire Accounts For Sale</h2>
        <div class="grid">
            <div class="card">
                <h3>Level 72 | Rare Bundle</h3>
                <p>Rs. 12,000.00</p>
                <button class="btn" onclick="openCheckout('Acc: Level 72 Rare Bundle', 'Rs. 12,000')">Buy Now</button>
            </div>
            <div class="card">
                <h3>Level 60 | Cobra Skin</h3>
                <p>Rs. 6,500.00</p>
                <button class="btn" onclick="openCheckout('Acc: Level 60 Cobra Skin', 'Rs. 6,500')">Buy Now</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h3>Complete Your Order</h3>
            <p id="selectedItemName" style="color: #ff7300; margin: 10px 0;"></p>
            <input type="text" id="playerName" placeholder="Player UID / In-Game Name">
            <input type="text" id="playerPhone" placeholder="Your WhatsApp Number">
            <button class="btn" onclick="sendOrder()">Confirm Order via WhatsApp</button>
            <button class="btn close-btn" onclick="closeCheckout()">Cancel</button>
        </div>
    </div>

    <script>
        let currentItem = "";
        let currentPrice = "";

        function openCheckout(item, price) {
            currentItem = item;
            currentPrice = price;
            document.getElementById("selectedItemName").innerText = item + " (" + price + ")";
            document.getElementById("checkoutModal").style.display = "flex";
        }

        function closeCheckout() {
            document.getElementById("checkoutModal").style.display = "none";
        }

        function sendOrder() {
            let name = document.getElementById("playerName").value;
            let phone = document.getElementById("playerPhone").value;
            let myWhatsApp = "94771234567"; // මෙතනට ඔයාගේ WhatsApp අංකය දාන්න (උදා: 947...)

            if(name === "" || phone === "") {
                alert("කරුණාකර සියලුම විස්තර ඇතුළත් කරන්න!");
                return;
            }

            let message = `New Order!%0A*Item:* ${currentItem}%0A*Price:* ${currentPrice}%0A*UID/Name:* ${name}%0A*Contact:* ${phone}`;
            let url = `https://wa.me/${myWhatsApp}?text=${message}`;
            
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
